name: Core Research Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: python -m py_compile main.py src/*.py scripts/*.py tests/*.py

      # The confirmatory statistics (src/paired_bootstrap.py) use the
      # repository's single Wang PR-AUC helper, which needs scikit-learn. Both
      # of these are already declared in requirements.txt; installing them here
      # means the pre-registered protocol is actually covered by CI rather than
      # skipped. torch/transformers stay out: nothing under test needs a model.
      - name: Install core math dependencies
        run: >-
          python -m pip install
          "numpy>=2.0,<3.0"
          "scipy>=1.13,<2.0"
          "scikit-learn>=1.5,<2.0"

      - name: Run core math tests
        run: python -m unittest discover -s tests -v
