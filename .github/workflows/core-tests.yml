name: Core Research Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: python -m py_compile main.py src/*.py scripts/*.py tests/*.py

      - name: Install core math dependency
        run: python -m pip install "numpy>=2.0,<3.0"

      - name: Run core math tests
        run: python -m unittest discover -s tests -v
